services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: job_admin
    ports:
      - "3306:3306"
    volumes:
      - ./job-admin/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  job-admin:
    build:
      context: .
      dockerfile: job-admin/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_admin?useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: pass
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  job-demo:
    build:
      context: .
      dockerfile: job-demo/Dockerfile
    environment:
      JOB_EXECUTOR_ADMIN_URL: http://job-admin:8080
      JOB_EXECUTOR_SYSTEM_CODE: job-demo
    ports:
      - "8082:8082"
    depends_on:
      - job-admin
