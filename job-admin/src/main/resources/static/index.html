    <!-- 表格 -->
    <table border="1" cellpadding="8" style="border-collapse:collapse; width:100%">
        <thead>
        <tr>
            <th>Job名称</th>
            <th>系统</th>
            <th>状态</th>
            <th>调度类型</th>
            <th>表达式</th>
            <th>描述</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr v-for="job in jobs" :key="job.id">
            <td>{{ job.jobName }}</td>
            <td>{{ job.systemCode }}</td>
            <td :style="{ color: isRunning(job) ? '#e6a23c' : statusColor(job.status) }">{{ isRunning(job) ? '在执行' : statusText(job.status) }}</td>
            <td>{{ job.scheduleType }}</td>
            <td>{{ job.scheduleExpr }}</td>
            <td>{{ job.description }}</td>
            <td>
                <button v-if="job.status==='ENABLED'" @click="disableJob(job)">禁用</button>
                <button v-if="job.status==='DISABLED'" @click="enableJob(job)">启用</button>
                <button @click="executeJob(job)">执行</button>
                <button v-if="job.longRunning" @click="stopJob(job)">停止</button>
                <button @click="openLogDialog(job)">日志</button>
                <button @click="openEditDialog(job)">调度</button>
            </td>
        </tr>
        </tbody>
    </table>

    <!--                           :disabled="scope.row.status === 'UNREACHABLE'" @click="stopJob(scope.row)">停止-->
    <!--                </el-button>-->

    <!--            </template>-->
    <!--        </el-table-column>-->

    <!-- 日志对话框 -->
    <el-dialog v-model="logDialogVisible" :title="'执行日志 - ' + logJobName" width="700px">
        <pre style="max-height: 400px; overflow: auto; background: #f5f5f5; padding: 10px;">{{ logLines.join('\n') || '暂无日志' }}</pre>
    </el-dialog>

    <!-- 编辑对话框（不变） -->
    <el-dialog v-model="editDialogVisible" title="编辑调度配置" width="500px">
        <el-form :model="editForm" label-width="100px">
            <el-form-item label="调度类型">
                <el-select v-model="editForm.scheduleType">
                    <el-option label="无（手动）" value="NONE"/>
                    <el-option label="CRON" value="CRON"/>
                    <el-option label="固定延迟(毫秒)" value="FIXED_RATE"/>
                </el-select>
            </el-form-item>
            <el-form-item label="表达式" v-if="editForm.scheduleType !== 'NONE'">
                <el-input v-model="editForm.scheduleExpr"/>
            </el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="editDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="saveScheduleConfig">保存</el-button>
        </template>
    </el-dialog>
</div>

<script>
    const {createApp, ref, reactive, onMounted} = Vue

    const app = createApp({
        setup() {
            // 改为你的实际地址
            const API_BASE = 'http://localhost:8080/api'
            const ENV_NAME = '-测试'

            const jobs = ref([])
            const runningJobs = ref([])
            const loading = ref(false)
            const editDialogVisible = ref(false)
            const logDialogVisible = ref(false)
            const logJobName = ref('')
            const logLines = ref([])
            const editForm = reactive({id: null, jobName: '', scheduleType: 'NONE', scheduleExpr: ''})

            const statusType = (s) => {
                if (s === 'ENABLED') return 'success'
                if (s === 'DISABLED') return 'info'
                if (s === 'UNREACHABLE') return 'danger'
                return ''
            }
            const statusText = (s) => {
                if (s === 'ENABLED') return '已启用'
                if (s === 'DISABLED') return '已禁用'
                if (s === 'UNREACHABLE') return '不可调度'
                return s
            }

            const loadJobs = async () => {
                loading.value = true
                try {
                    const res = await axios.get(`${API_BASE}/jobs`)
                    console.log('获取到的数据：', res.data)
                    jobs.value = res.data
                    try {
                        const r = await axios.get(`${API_BASE}/schedule/running`)
                        runningJobs.value = r.data || []
                    } catch (e) {
                        console.error('查询运行中任务失败：', e)
                        runningJobs.value = []
                    }
                } catch (e) {
                    console.error('请求失败：', e)
                    ElementPlus.ElMessage.error('加载失败: ' + e.message)
                } finally {
                    loading.value = false
                }
            }

            const isRunning = (job) => runningJobs.value.includes(job.jobName)

            const enableJob = async (job) => {
                try {
                    await axios.put(`${API_BASE}/jobs/${job.id}`, {...job, status: 'ENABLED', enabled: true})
                    ElementPlus.ElMessage.success('已启用')
                    loadJobs()
                } catch (e) {
                    ElementPlus.ElMessage.error('操作失败')
                }
            }

            const disableJob = async (job) => {
                try {
                    await axios.put(`${API_BASE}/jobs/${job.id}`, {...job, status: 'DISABLED', enabled: false})
                    ElementPlus.ElMessage.success('已禁用')
                    loadJobs()
                } catch (e) {
                    ElementPlus.ElMessage.error('操作失败')
                }
            }

            const executeJob = async (job) => {
                try {
                    await axios.post(`${API_BASE}/schedule/execute/${job.id}`)
                    ElementPlus.ElMessage.success('执行指令已发送')
                } catch (e) {
                    ElementPlus.ElMessage.error(e.response?.data || '执行失败')
                }
            }

            const stopJob = async (job) => {
                try {
                    await axios.post(`${API_BASE}/schedule/stop/${job.id}`)
                    ElementPlus.ElMessage.success('停止指令已发送')
                } catch (e) {
                    ElementPlus.ElMessage.error('停止失败')
                }
            }

            const openLogDialog = async (job) => {
                logJobName.value = job.jobName
                logLines.value = []
                logDialogVisible.value = true
                try {
                    const r = await axios.get(`${API_BASE}/schedule/logs`, {
                        params: {jobName: job.jobName, limit: 200}
                    })
                    logLines.value = r.data || []
                } catch (e) {
                    ElementPlus.ElMessage.error(e.response?.data || '加载日志失败')
                }
            }

            const openEditDialog = (job) => {
                editForm.id = job.id
                editForm.jobName = job.jobName
                editForm.scheduleType = job.scheduleType || 'NONE'
                editForm.scheduleExpr = job.scheduleExpr || ''
                editDialogVisible.value = true
            }

            const saveScheduleConfig = async () => {
                try {
                    const job = jobs.value.find(j => j.id === editForm.id)
                    if (!job) return
                    await axios.put(`${API_BASE}/jobs/${editForm.id}`, {
                        ...job,
                        scheduleType: editForm.scheduleType,
                        scheduleExpr: editForm.scheduleExpr
                    })
                    ElementPlus.ElMessage.success('调度配置已更新')
                    editDialogVisible.value = false
                    loadJobs()
                } catch (e) {
                    ElementPlus.ElMessage.error('保存失败')
                }
            }
            const statusColor = (s) => {
                return s === 'ENABLED' ? 'green' : s === 'UNREACHABLE' ? 'red' : 'gray'
            }

            onMounted(() => {
                loadJobs()
                setInterval(loadJobs, 10000)
            })

            return {
                envName: ENV_NAME,
                statusColor,
                isRunning,
                jobs,
                loading,
                editDialogVisible,
                logDialogVisible,
                logJobName,
                logLines,
                openLogDialog,
                statusType,
                statusText,
                loadJobs,
                enableJob,
                disableJob,
                executeJob,
                stopJob,
                openEditDialog,
                saveScheduleConfig
            }
        }
    })

    app.use(ElementPlus)
    app.mount('#app')
</script>
</body>
