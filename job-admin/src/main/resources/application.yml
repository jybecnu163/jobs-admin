server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: pass
    driver-class-name: com.mysql.cj.jdbc.Driver
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:schema.sql   # 首次启动可自动建表（生产环境建议手动执行）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

job:
  admin:
    baseline-file: classpath:job-schedules-baseline.yml
    import:
      enabled: true
      approval-token: change-me-to-a-secure-token   # 生产环境必须修改
  executor:
    heartbeat-interval: 10   # 心跳间隔（秒）
    offline-threshold: 30    # 离线判定阈值（秒）
